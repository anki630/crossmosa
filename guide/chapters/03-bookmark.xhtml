<h1>3　書籤</h1>

<p>紙本書折角的地方，這裡叫書籤，動作是長按確認鍵。</p>

<p>但它出廠是關的。長按確認鍵預設不綁任何動作，因為讀到一半誤觸的代價比較大。要用先去開：<strong>設定 → 操作 → 長按確認鍵功能</strong>，把「停用」改成「書籤」。</p>

<p>開完之後回主畫面，最上面那一項「繼續閱讀」會直接把你送回這一頁。</p>

<p>然後在任何一頁按住確認鍵約半秒，畫面會冒出「已加入書籤。」這行字。同一頁再按一次就是移除，訊息換成「已移除書籤。」</p>

<p>要回到加過書籤的地方：閱讀選單裡會多出「書籤」這一項——書裡一個書籤都沒有的時候，這一項不會出現。</p>

<p class="do"><strong>現在：去把它打開，回來給這一頁加個書籤。</strong></p>
