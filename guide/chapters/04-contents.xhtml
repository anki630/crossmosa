<h1>4　選擇章節</h1>

<p>閱讀中按確認鍵，選單第一項就是「選擇章節」。這本書的每一章都在裡面，最後那頁註釋也在。</p>

<p>章節多到一頁放不下的書，清單會分頁，標題列右邊跟著出現「2/5」這種頁碼。長按上下鍵整頁翻，不用一項一項移過去。這本書短，大概一頁就列完了。</p>

<p>跳到別章沒有「上一步」。跳走之後要回來，就再開一次選單、再選一次章名。所以跳之前先記住你在哪一章——現在是第 4 章。</p>

<p>選單裡還有「跳至指定進度」。想去書的正中間、又不在乎那是第幾章的時候用它。</p>

<p class="do"><strong>現在：跳到第 1 章，看一眼，再跳回第 4 章。</strong></p>
