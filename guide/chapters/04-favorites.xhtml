<h1>4　把書放進最愛</h1>

<p>在「Formosa Cover」首頁或書架選中一本書，長按確認鍵，會開啟書本選單。</p>

<figure-page src="fig-longpress" alt="書架的書本選單"/>

<p>選單中的①「加入最愛」會把這本書放進「最愛」分頁。加入後再開一次選單，同一項會變成「從最愛移除」。</p>

<p>②「從最近閱讀移除」只會清掉最近閱讀紀錄，不會刪除 SD 卡上的書檔。</p>

<p>回到書架的分頁列，選「最愛」就能只看收藏過的書。</p>

<p class="do"><strong>現在：回到書架，長按這本書，選「加入最愛」。</strong></p>
