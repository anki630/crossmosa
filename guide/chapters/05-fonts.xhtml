<h1>5　換一套字</h1>

<p>閱讀中按確認鍵，再選「文字設定」。也可從<strong>設定 → 閱讀器 → 文字設定</strong>進入。</p>

<figure-page src="fig-text-settings" alt="文字設定畫面"/>

<p>①是預覽，選了就會立刻變。②是「字型」、「字級」、「版面」與「樣式」四個分頁。③是目前選取的字型。</p>

<p>在「字型」選一套字，再到「字級」選合適大小。書頁會重新排列，閱讀位置會保留。</p>

<p>中文字型要另外下載，放進 SD 卡最外層的 <strong>fonts</strong> 資料夾，或在第 10 章的檔案傳輸網頁上傳。放好之後，字型名稱就會出現在「字型」清單。每套字型可選的字級可能不同。</p>

<p class="do"><strong>現在：開啟「文字設定」，在「字級」改一次大小。</strong></p>
