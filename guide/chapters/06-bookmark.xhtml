<h1>6　在這一頁夾書籤</h1>

<p>要用確認鍵快速加書籤，先開啟<strong>設定 → 操作 → 長按確認鍵功能</strong>，把「停用」改成「書籤」。</p>

<p>回到書頁後，長按確認鍵。在 EPUB 書中，畫面會顯示「已加入書籤。」同一頁再長按一次，會顯示「已移除書籤。」</p>

<p>書裡有書籤時，閱讀選單會出現「書籤」。選進去就能回到夾過書籤的頁面。</p>

<p>不想使用快速鍵時，也可在閱讀選單選「新增/移除書籤」。</p>

<p class="do"><strong>現在：把「長按確認鍵功能」設為「書籤」，再回來給這一頁加書籤。</strong></p>
