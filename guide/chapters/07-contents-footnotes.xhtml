<h1>7　找章節與註腳</h1>

<p>閱讀中按確認鍵，會開啟閱讀選單。</p>

<figure-page src="fig-reader-menu" alt="閱讀選單"/>

<p>①「選擇章節」會開啟目錄。②「文字設定」可調整字型與版面。③「截圖」會保存目前畫面。</p>

<p>在章節清單短按導覽鍵，一次移動一項。按住導覽鍵，可以翻過整頁。選好章節後按確認。</p>

<p>當前書頁有註腳時，閱讀選單會出現「註腳」。如果同一頁有多個註腳，先從清單選一個。</p>

<p>跳到註腳後，短按返回，就會回到剛才那一頁。</p>

<p class="do"><strong>現在：開啟閱讀選單，選這個「註腳」<a href="90-notes.xhtml#fn-1">[1]</a>，讀完後短按返回。</strong></p>
