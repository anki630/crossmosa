<h1>6　圖片與灰階</h1>

<p class="figure"><img src="images/greyscale.png" alt="四階灰色塊、一個三角形與一個圓"/></p>

<p>上面四塊灰，是這塊螢幕的全部。黑、深灰、淺灰、白，就這四階。你在這台機器上看到的所有圖片、所有名畫壁紙，最後都被壓進這四個值裡。</p>

<p>圖下面的三角形和圓拿來看邊緣。斜線和弧線在方格上畫不直，只能用階梯逼近。</p>

<p>文字也吃得到灰。<strong>設定 → 閱讀器 → 文字反鋸齒</strong>，出廠是開的。它在筆畫邊緣補灰點，讓中文那些很細的撇捺不那麼毛。</p>

<p>代價是每翻一頁多等大約半秒，而且分兩次到：黑字先出現，過一下輪廓才變柔。那不是當機。那是螢幕在推動電泳粒子，第二趟本來就要花那麼久。</p>

<p>嫌慢就關掉。字會硬一點，翻頁明顯快。</p>

<p class="do"><strong>現在：回頭看一眼那個三角形的斜邊。</strong></p>
