<h1>9　看圖片與整頁圖</h1>

<p class="figure"><img src="images/greyscale.png" alt="灰階色塊與圖形邊緣"/></p>

<p>電子紙會用灰階顯示圖片。看圖時，可以從上面的色塊與圖形邊緣，確認深淺層次。</p>

<p>要決定書中圖片的顯示方式，開啟<strong>設定 → 閱讀器 → 圖片</strong>。可選「顯示」、「佔位框」或「不顯示」。</p>

<p>選「顯示」會畫出圖片。選「佔位框」不畫圖，圖片有說明文字時改顯示說明文字。選「不顯示」則會略過圖片。</p>

<p>有些書（例如畫冊）把一幅圖做成整頁的版面。這種頁面會用整個螢幕顯示，不加狀態列。</p>

<figure-page src="fig-fullpage" alt="一幅名畫整頁顯示"/>

<p>翻離整頁圖後，下一頁會回到一般文字版面。</p>

<p class="do"><strong>現在：回看灰階圖，找出最深與最淺的色塊。</strong></p>
