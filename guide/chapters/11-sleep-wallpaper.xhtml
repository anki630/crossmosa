<h1>11　休眠與待機畫面</h1>

<p>長按電源鍵，CrossMosa 會顯示待機畫面並進入休眠。要繼續閱讀，再按住電源鍵，它會回到離開前的頁面。</p>

<p>休眠後什麼時候真正關機，由機器自己決定。你不需要判斷現在是休眠還是關機，要讀書時，按住電源鍵就好。</p>

<p>要更換待機畫面，開啟<strong>設定 → 顯示 → 待機畫面</strong>。可選「深色」、「淺色」、「自訂」、「封面」、「封面＋自訂」或「無」。</p>

<p>要用自己的圖，在 SD 卡最外層建立 <strong>sleep</strong> 資料夾，放入 BMP 圖片，再選「自訂」。一張圖就能顯示；放入多張時，每次休眠隨機換一張。</p>

<p class="do"><strong>現在：長按電源鍵，看看目前的待機畫面，再按住電源鍵回來。</strong></p>
