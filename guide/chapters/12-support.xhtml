<h1>11　如果它讓你的 X3 變好用了</h1>

<p>這是下班之後寫的個人專案，免費、開源，不是產品。</p>

<p>如果它讓你的機器變好用了，有幾種方式可以讓寫的人開心：</p>

<p>到 GitHub 的 Discussions 留一句話，說說你拿它讀了什麼書。<strong>這是我最想看的。</strong>寫韌體的人看不到使用者，唯一的回饋就是你打的那幾個字。</p>

<p>推薦給也有 X3 的朋友。</p>

<p>請我喝杯咖啡（連結籌備中）。不影響任何功能，純粹讓下一版寫得更有勁。</p>

<p>缺字和 bug 一樣歡迎開 Issue。上游 CrossPoint 本身的問題請發到上游的 repo，那邊才修得動。</p>
