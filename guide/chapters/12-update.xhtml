<h1>12　更新韌體</h1>

<p>把適用於這台機器的 .bin 韌體檔放到 SD 卡。然後開啟<strong>設定 → 系統 → SD 卡韌體更新</strong>。</p>

<figure-page src="fig-settings-system" alt="系統設定中的韌體更新"/>

<p>①是「SD 卡韌體更新」。選取後，機器會開啟韌體檔清單。</p>

<figure-page src="fig-firmware-pick" alt="選擇 bin 韌體檔"/>

<p>①是要安裝的 .bin 韌體檔。選取正確檔案，確認更新，再等機器完成並重新啟動。</p>

<p>更新後如果不對勁，或是進不了設定，書末的「進階：更新出問題時」有救援的方法。一般用不到。</p>

<p class="do"><strong>現在：開啟系統設定，找到「SD 卡韌體更新」，但先不執行更新。</strong></p>
