<h1>13　遇到方塊字</h1>

<p>書的內文出現□時，先開啟「文字設定」，在「字型」分頁換一套字型。不同字型收錄的字不同，不要假設每套都有所有漢字。</p>

<p>書名、目錄或清單出現□時，也可改用涵蓋較廣的 SD 字型。目前選取的 SD 字型若有合適的尺寸與字形，也會幫介面補上內建字型沒有的字。</p>

<p>若換過字型仍是□，請記下那個字與出現位置。回報時，直接貼上原字，並說明它出現在內文、書名、目錄還是清單。</p>

<p>若還需要機器資訊，可到<strong>設定 → 系統 → 裝置資訊</strong>查看。</p>

<p class="do"><strong>現在：看看這一頁的標題與內文，確認有沒有□。</strong></p>
