<h1>進階　更新出問題時</h1>

<p>這一章給更新之後遇到問題的人。機器正常的話，可以跳過。</p>

<p><strong>更新後不對勁：</strong>可切回更新前的版本。如果機器裡沒有上一版，它會照常開機。在關機狀態，同時按住返回與上一頁，再按住電源開機。約兩秒後，三顆鍵一起放開。</p>

<figure-page src="fig-rescue" alt="X3 切回上一版韌體的按鍵"/>

<p>在 X3 上，①是左側的上一頁，②是右上的電源，③是正面最左的返回。</p>

<figure-page src="fig-rescue-x4" alt="X4 切回上一版韌體的按鍵"/>

<p>在 X4 上，①是右側的上一頁，②是右側最上面的電源，③是正面最左的返回。</p>

<p><strong>進不了設定：</strong>可直接進入「復原模式」。在關機狀態，按住上一頁，再按電源開機；保持按住，直到出現韌體檔選擇畫面。X3 的上一頁是左側鍵，X4 的上一頁是右側的翻頁鍵上面那顆。</p>
