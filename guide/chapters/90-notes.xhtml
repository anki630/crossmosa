<h1>註釋</h1>

<p id="fn-1">[1] 明體在 SD 卡上的資料夾名：NotoSerifTC。</p>

<p id="fn-2">[2] 黑體的資料夾名：NotoSansTC。</p>

<p id="fn-3">[3] 芫荽的資料夾名：Iansui。那條硬上限：單一字型的碼位區段數不能超過 4,096，涵蓋的字愈分散、區段愈多，所以這套字只挑常用字收。</p>

<p id="fn-4">[4] 你按了。</p>

<p>開機時出現的那隻是台灣黑熊，左上角那彎淺灰色的是月亮。名字的兩半也在那裡：Cross 來自它的來源專案 CrossPoint，Mosa 來自 Formosa。</p>
