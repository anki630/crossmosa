[platformio]
default_envs = default
# build_cache_dir 已停用(2026-07-30)。它在 10 天內長到 27GB / 39,386 個檔案,
# 佔滿 94% 的磁碟,而且幾乎沒有回報:
#   - 增量建置的速度(gh_release 約 51-57s)來自 .pio/build 的物件檔,不是這個快取。
#   - `-DCROSSPOINT_VERSION` 是每個編譯單元都帶的全域旗標,所以【每次改版號就讓
#     整個快取失效】—— 而本專案每出一版 output/vN 就改一次版號。
#   - 實測 mtime 分布:39,386 個項目全部在 10 天內產生、舊項目從未被重用也從未被淘汰。
#     它只寫不讀,是垃圾場而非快取。
# 若日後真的需要(例如頻繁 `pio run -t clean` 或頻繁切分支重建),把它指到
# 專案外的路徑並自己定期清理,不要放回專案內無上限累積。
extra_configs = platformio.local.ini

[crosspoint]
# CrossMosa 發佈版號。**只有 CrossMosa 自己的語意化版號,不含上游版本與內部建置號。**
#
# 1.0.0 曾經是 `1.0.0 (cp1.4.1 build 115)` —— 三個數字寫在一起,原意是讓一行版號就能定位
# 「哪一版 CrossMosa / 疊在上游哪一版 / 對應哪一次內部建置」。1.1.0 起改成純版號:
# 那兩個數字是開發端的資訊,不該佔用使用者每天看到的那一行。
# 對應關係改記在 CHANGELOG 每一節的標題(「based on CrossPoint x.y.z, internal build N」),
# 需要追溯時查得到,而且比塞在字串裡更完整。
#
# 版號規則(merge 上游時尤其要記得):
#   patch  1.1.x  只修 bug
#   minor  1.x.0  加新功能,**或 merge 上游一個版本**(即使我們自己沒加東西,
#                 對使用者而言那就是一包新東西)
#   major  x.0.0  使用者會痛的破壞性變更 —— 設定被重置 / 閱讀進度找不回來 /
#                 刷機步驟改變 / 拿掉既有功能。單純「快取重排一次」不算。
#   ⚠️ 不要讓 CrossMosa 的版號去追上游的數字。CrossMosa 的 tag 一律帶 `v` 前綴
#      (v1.1.0),上游的是裸數字(1.4.1)—— 前綴就是兩條線的分辨器。
#
# 顯示在開機畫面下緣與設定頁標題列右側(CROSSPOINT_VERSION);
# 也進 crash report、diag.log、HTTP User-Agent 與網頁設定頁的 JSON。
#
# ⚠️ 每個 env 的 build flag 仍然【整條用單引號包起來】
#    ('-DCROSSPOINT_VERSION="${crosspoint.version}"')。現在的字串雖然沒有空白了,
#    但那個引號是防呆:哪天版號又出現空白(rc / dev 後綴),沒有它 PlatformIO 會依空白
#    把 define 切成 CROSSPOINT_VERSION="1.1.0 而其餘變成獨立引數。
version = 1.2.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
# v30 繁中自訂:內建 fallback 閱讀字型縮到單一 notosans_14(閱讀一律用 SD 中文字型,
# 內建拉丁字型只是 SD 不可用時的備援;省 ~373KB flash)。getReaderFontId 有對應 remap。
  -DOMIT_FONTS
  -DFREEINK_NET_WOLFSSL=1
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_SP_RISCV32
; v106: 讓 ECC 真的走單精度路徑。WOLFSSL_SP_RISCV32(上游加的)只提供 RISC-V 的
; 最佳化組合語言,但沒有 WOLFSSL_HAVE_SP_ECC 的話 ECC 根本不會走 SP,而是掉回通用
; fastmath —— 配上同一個檔案裡的 FP_MAX_BITS 16384,每個大數緩衝就是約 2KB,
; ECC 點運算的預算表要數十 KB。v105 的 wolfSSL 追蹤直接指名了後果:
;   SendTls13ClientHello → EccMakeKey → ecc_make_pub_ex failed → -125 (MEMORY_E)
; 而當下最大連續塊是 49,140。v83 的餘裕撐得住、v104 撐不住 —— 這條路徑一直很脆弱,
; 是 BLE 連結進來把它推過了臨界點。SP 對 P-256/P-384 用固定大小的小緩衝,不建那張表。
; 刻意不加 WOLFSSL_SP_NO_MALLOC:那會把緩衝改放堆疊,而這個專案的堆疊預算是 256 bytes。
  -DWOLFSSL_HAVE_SP_ECC
  -DWOLFSSL_SP_384
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI
; NimBLE tuning. MYNEWT_VAL_* / CONFIG_NIMBLE_CPP_* are NimBLE-Arduino's own knobs
; (not Kconfig keys), so they stay as -D and cannot collide with a generated
; sdkconfig.h. Every CONFIG_BT_* trim lives in custom_sdkconfig below instead — a
; -D of the same key gets redefined by sdkconfig.h and -Werror on framework code
; turns that into a build failure. BLE_HS_LOG_LVL=5 (NONE) drops ~32KB of strings.
  -DMYNEWT_VAL_BLE_HS_LOG_LVL=5
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
; v89: 真正關掉 peripheral/broadcaster 角色。sdkconfig 的 ROLE_*=n 只會讓巨集變成
; 「未定義」,而 NimBLE-Arduino 的 nimconfig.h 對未定義的角色【預設補回啟用】——
; 只有這個 _DISABLED 拼法才有效,而它不是 Kconfig key,不會與 sdkconfig.h 相撞。
; 我們是純 central(連遙控器),不廣播也不當周邊。
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

; v108: BLE is off by default; keep its sources out of the build entirely so the linker
; never sees them (the stub in BleRemoteManager.h handles the call sites).
build_src_filter =
  +<*>
  -<ble/>
  -<activities/settings/BleRemotePairingActivity.cpp>

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
; v104: only needed by the framework rebuild above
;  pre:scripts/patch_arduino_esp32.py
  pre:scripts/patch_wolfssl.py
; v111: framework NetworkManager::hostByName 的 dns_clear_cache 沒拿 TCPIP 核心鎖
;       (連 WiFi 後偶發重開機);腳本會逐位元組比對上游內容,對不上就中止建置
  pre:scripts/patch_network_dns_lock.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/register_unit_tests_target.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
  wolfssl/Arduino-wolfSSL @ 5.7.2
  ; BLE remote (v84): NimBLE central for HID page-turner remotes (BleRemoteManager).
  ; Pinned; note most CONFIG_BT_NIMBLE_* build flags are inert on this core
  ; (sdkconfig.h hard-defines win) — only MYNEWT_VAL_* / CONFIG_NIMBLE_CPP_*
; v108: BLE off by default — see BleRemoteManager.h
;  h2zero/NimBLE-Arduino @ 2.5.1
  ; smb2: no callers yet (task 1 of smb2-server plan is vendoring-only). Listing it
  ; explicitly forces the library into the build despite no #include referencing it,
  ; so we can prove it compiles ahead of the server code landing in later tasks.
; v109: SMB2 再次移除(實機使用體驗不佳)。程式碼與 vendored libsmb2 都留著,
; 要回來把這一行取消註解即可 —— v64-v82 的所有修正都還在。
;  smb2

lib_ignore =
  BLE
  ; v89: custom_sdkconfig 的 framework 重建會讓 PlatformIO 自己編 Arduino 的
  ; libraries/(產物是 .pio/build/<env>/RMaker.cpp.o 這種,與 CMake/IDF 那條路徑
  ; 不同),而 RainMaker/Insights 依賴 custom_component_remove 移掉的 esp_rainmaker
  ; → fatal error: esp_rmaker_core.h。改 CMakeLists 的 ARDUINO_ALL_LIBRARIES
  ; (CrumBLE 的做法)打不到這條路徑,要用 PlatformIO 自己的 lib_ignore。
; v104: only needed by the framework rebuild above
;  RainMaker
;  Insights

; v85 量測版:把 NimBLE 的執行期池砍到單一 central 連線所需的最小值。
; 任何一個 custom_sdkconfig 條目都會觸發【整個 ESP-IDF framework 重建】(約 8-10 分鐘)
; ——那正是能改到 CONFIG_BT_* 的唯一途徑(-D 旗標會被預編譯的 sdkconfig.h 蓋掉)。
; ⚠️ 已實測:這些 trims 只砍執行期,連結成本幾乎不動(_heap_start 只移 288 B)。
; ⚠️ framework 重建會【就地覆寫】~/.platformio 的共用套件且無備份;要回到未調校狀態
;    必須刪掉 framework-arduinoespressif32-libs 讓它重新下載(還原後 RAM 應回到 62,364)。
; 陷阱:①同一個 key 不可同時出現在 -D 與此處;②MSYS1_BLOCK_COUNT 是 NimBLE-Arduino 的
; 相容別名不是 Kconfig key,只設 MSYS_1_BLOCK_COUNT;③Kconfig 對超範圍的值靜默忽略,
; 設完必須回頭讀產生的 sdkconfig 驗證;④ROLE_PERIPHERAL=n 不會關掉角色(=n 讓巨集變
; 未定義,而 nimconfig.h 對未定義的角色預設補回啟用),要真關需 -D..._DISABLED。
; v104: DISABLED — see the block below.
; custom_component_remove =
;  espressif/esp_insights
;  espressif/esp_rainmaker
;  espressif/esp_diagnostics
;  espressif/esp_diag_data_store
;  espressif/esp_schedule
;  espressif/esp_rcp_update

; ⚠️ v104: custom_sdkconfig DISABLED — it is the prime suspect for OPDS breaking.
;
; Bisected on hardware: OPDS fetches this feed on v83 and fails on v102/v103, same network,
; same server (verified healthy from a dev machine: 0.098 s response, valid TLS 1.2). Then the
; decisive test — forget the pairing so NimBLE is never initialised at all — STILL failed. So
; the cause is not BLE at runtime, and not the radio, and not memory (a framebuffer loan worth
; 52,272 bytes changed nothing).
;
; What custom_sdkconfig does besides setting CONFIG_BT_*: it triggers a full ESP-IDF framework
; rebuild, and that rebuild OVERWRITES ~/.platformio's shared framework package in place. From
; v85 on, this firmware has been linking against a locally rebuilt framework instead of
; Espressif's prebuilt one — and WiFi and LWIP both come from there. Symptoms fit: WiFi
; association went from ~3 s to 7-18 s, local HTTP still works, remote TLS times out at ~31 s.
;
; The trims bought ~2.3 KB of runtime heap (measured in v89). That is not worth a rebuilt
; network stack. The BLE role cuts that actually mattered are -D flags in build_flags and are
; unaffected by this.
; custom_sdkconfig =
  ; 單一 central 連線;peripheral / broadcaster 角色用不到
;  CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
;  CONFIG_BT_NIMBLE_MAX_BONDS=1
;  CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=n
;  CONFIG_BT_NIMBLE_ROLE_BROADCASTER=n
  ; HID input report 只有 8-16 bytes,MTU 用最小值
;  CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=23
;  CONFIG_BT_NIMBLE_ATT_MAX_PREP_ENTRIES=2
;  CONFIG_BT_NIMBLE_GATT_MAX_PROCS=1
;  CONFIG_BT_NIMBLE_MAX_CCCDS=6
;  CONFIG_BT_NIMBLE_HS_FLOW_CTRL=n
  ; mbuf / ACL / event 池:預設是為多連線吞吐設計的
;  CONFIG_BT_NIMBLE_MSYS_1_BLOCK_COUNT=3
;  CONFIG_BT_NIMBLE_MSYS_2_BLOCK_COUNT=6
;  CONFIG_BT_NIMBLE_ACL_BUF_COUNT=6
;  CONFIG_BT_NIMBLE_HCI_EVT_HI_BUF_COUNT=12
;  CONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=2
;  CONFIG_BT_NIMBLE_TRANSPORT_EVT_COUNT=4
;  CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=2560
  ; controller:每個 ACT slot 約 3KB,只連一台遙控器
;  CONFIG_BT_CTRL_BLE_MAX_ACT=1
;  CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50
;  CONFIG_BT_CTRL_ADV_DUP_FILT_MAX=10
  ; v89:關掉一顆 HID 遙控器完全用不到的整批功能。實測動機——BLE 開著時字型預載
  ; 的最大連續塊只剩 4,852(關著是 25,588),字型快取只拿到需要的三分之一,每頁掉
  ; 500-1000 個字、翻頁 3-4 秒。差距約 20KB,而下面這些都是會配緩衝的東西:
  ;   BLE 5.0 擴充廣播 / 週期同步 / 擴充掃描:遙控器走 legacy 廣播(實測掃得到)
  ;   Coded PHY:長距離模式,遙控器在手邊
  ;   DTM:出廠測試模式,產品用不到
  ;   Mesh 掃描去重:我們不是 mesh 節點
  ;   掃描去重快取 100 → 20:只影響重複回報次數,不影響功能
;  CONFIG_BT_NIMBLE_50_FEATURE_SUPPORT=n
;  CONFIG_BT_NIMBLE_EXT_ADV=n
;  CONFIG_BT_NIMBLE_ENABLE_PERIODIC_SYNC=n
;  CONFIG_BT_NIMBLE_EXT_SCAN=n
;  CONFIG_BT_NIMBLE_EXTRA_ADV_FIELDS=n
;  CONFIG_BT_NIMBLE_LL_CFG_FEAT_LE_CODED_PHY=n
;  CONFIG_BT_NIMBLE_DTM_MODE_TEST=n
;  CONFIG_BT_NIMBLE_VS_SUPPORT=n
;  CONFIG_BT_CTRL_DTM_ENABLE=n
;  CONFIG_BT_CTRL_BLE_MESH_SCAN_DUPL_EN=n
;  CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=20

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  '-DCROSSPOINT_VERSION="${crosspoint.version}"'
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  '-DCROSSPOINT_VERSION="${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}"'
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  '-DCROSSPOINT_VERSION="${crosspoint.version}-slim"'
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG
